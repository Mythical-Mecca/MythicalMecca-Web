<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Adventurers on a quest at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#101a30"/>
      <stop offset="80%" stop-color="#172238"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b441" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f2b441" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f2b441" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e0892f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e0892f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wisp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6cb8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4aa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2c3a5c"/>
      <stop offset="100%" stop-color="#172238"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#dce6ff">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="240" cy="160" r="1.1" opacity="0.5"/>
    <circle cx="360" cy="70" r="1.8" opacity="0.7"/>
    <circle cx="520" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="680" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="820" cy="150" r="1" opacity="0.5"/>
    <circle cx="960" cy="80" r="1.7" opacity="0.7"/>
    <circle cx="1120" cy="120" r="1.2" opacity="0.6"/>
    <circle cx="1320" cy="70" r="1.6" opacity="0.8"/>
    <circle cx="1460" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="1540" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="60" cy="220" r="1.2" opacity="0.5"/>
    <circle cx="430" cy="240" r="1" opacity="0.4"/>
    <circle cx="900" cy="220" r="1.3" opacity="0.5"/>
    <circle cx="1240" cy="240" r="1.1" opacity="0.5"/>
  </g>

  <!-- moon -->
  <circle cx="1200" cy="210" r="190" fill="url(#moonGlow)"/>
  <circle cx="1200" cy="210" r="78" fill="#f2b441"/>
  <circle cx="1232" cy="188" r="78" fill="#101a30" opacity="0.55"/>

  <!-- distant mountains -->
  <path d="M0 620 L210 430 L360 560 L560 380 L760 560 L980 410 L1220 580 L1420 440 L1600 560 L1600 900 L0 900 Z" fill="#16213a"/>
  <path d="M0 700 L260 560 L470 660 L720 520 L980 660 L1240 560 L1480 670 L1600 600 L1600 900 L0 900 Z" fill="#0f1830"/>

  <!-- foreground ground -->
  <path d="M0 720 C400 690 600 740 800 730 C1000 720 1250 760 1600 715 L1600 900 L0 900 Z" fill="#0a0f1d"/>

  <!-- winding path -->
  <path d="M792 624 L808 624 L900 900 L690 900 Z" fill="url(#path)" opacity="0.9"/>

  <!-- campfire glow + flames -->
  <ellipse cx="690" cy="792" rx="150" ry="90" fill="url(#fire)"/>
  <path d="M690 740 C702 762 712 770 706 786 C700 800 678 800 674 786 C668 768 682 762 690 740 Z" fill="#ffd27a"/>
  <path d="M690 752 C698 766 704 772 700 783 C695 793 683 793 680 783 C676 770 685 766 690 752 Z" fill="#e0892f"/>

  <!-- blue magic wisps -->
  <circle cx="980" cy="600" r="46" fill="url(#wisp)"/>
  <circle cx="430" cy="650" r="34" fill="url(#wisp)"/>

  <!-- adventurers (silhouettes) -->
  <g fill="#05080f">
    <!-- traveller with staff + orb -->
    <g transform="translate(560 690)">
      <path d="M0 0 C-14 0 -22 14 -22 40 L22 40 C22 14 14 0 0 0 Z"/>
      <circle cx="0" cy="-12" r="11"/>
      <rect x="26" y="-40" width="4" height="92" rx="2"/>
    </g>
    <circle cx="588" cy="648" r="9" fill="url(#wisp)"/>
    <!-- traveller with banner -->
    <g transform="translate(840 678)">
      <path d="M0 0 C-15 0 -24 15 -24 44 L24 44 C24 15 15 0 0 0 Z"/>
      <circle cx="0" cy="-13" r="12"/>
      <rect x="-34" y="-64" width="4" height="108" rx="2"/>
      <path d="M-30 -60 L4 -50 L-30 -38 Z" fill="#4aa8ff"/>
    </g>
    <!-- small companion -->
    <g transform="translate(740 712)">
      <path d="M0 0 C-11 0 -17 11 -17 30 L17 30 C17 11 11 0 0 0 Z"/>
      <circle cx="0" cy="-9" r="8"/>
    </g>
  </g>
</svg>
