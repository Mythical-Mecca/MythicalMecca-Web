name: Deploy (production)

# Deploys to Vercel production on every push to main, via the Vercel CLI.
# Builds SERVER-SIDE on Vercel (no --prebuilt) — mirrors the crcapps projects
# that deploy reliably. The older --prebuilt flow (vercel build in CI + upload)
# stalled at "Building…" on Vercel's side. Vercel auto-detects pnpm from the
# committed pnpm-lock.yaml, so no package-manager setup is needed here.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# All build-time env vars must be set in the Vercel project's Production
# environment, since the build runs on Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Links the CLI to the correct team + project and pulls settings.
      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment=production \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel attributes the deploy to the git commit author; it must be a
      # member of the Vercel team with deploy access or the build is blocked.
      # Re-author with an empty commit before deploying.
      - name: Set Git author for Vercel
        run: |
          git config user.email "cloudbluedevelopment@gmail.com"
          git config user.name "CloudBlue Development"
          git commit --allow-empty -m "Deploy: production (${{ github.sha }})"

      # Builds on Vercel's servers (no --prebuilt).
      - name: Deploy to production
        run: |
          vercel deploy --prod --yes \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --token=${{ secrets.VERCEL_TOKEN }}
